[package]
name = "world-db"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
prelude = {path = "../prelude"}
core-obj = { path = "../core-obj"}
async-trait = "0.1.74"
serde = {version = "1.0.193", features = ["derive"]}
futures = "0.3.30"
rustc-hash = "2.0.0"
chashmap-async = "0.1.1"

#Disk
tokio = {version = "1.36.0", features = ["fs","sync","rt","io-util","macros"]}
tokio-stream = "0.1.14"
bincode = "1.3.3"
tempfile = "3.8.1"
itertools = "0.13.0"


[features]
default = []
